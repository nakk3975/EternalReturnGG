name: API contracts
on:
  push:
    paths: ['src/**', 'contracts/**', 'scripts/**', '.github/workflows/api-contract.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      nickname:
        description: '실제 API로 검사할 최근 10게임 이상 플레이어 (비워두면 오프라인 검사만)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test src/test/js/*.test.cjs
  animal-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1 jsdom@26.1.0
      - run: npx playwright install --with-deps chromium
      - run: java scripts/PrepareOcr.java
      - run: node scripts/verify-animal-map.cjs
      - run: node scripts/verify-screen-assist-dom.cjs
      - run: node scripts/verify-screen-browser.cjs
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew test bootWar
  live:
    if: github.event_name == 'workflow_dispatch' && inputs.nickname != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify official API with repository secret
        env:
          ETERNAL_RETURN_API_KEY: ${{ secrets.ETERNAL_RETURN_API_KEY }}
          ER_VERIFY_NICKNAME: ${{ inputs.nickname }}
        run: node scripts/verify-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-contract-report
          path: live-verification.json
          retention-days: 14
