name: Windows overlay
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop-overlay.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-overlay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: java scripts/PrepareOcr.java
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: npm run prepare-assets
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Smoke test Electron runtime
        working-directory: desktop
        run: ./node_modules/.bin/electron.cmd . --smoke
      - run: npm run dist:win
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "desktop/dist/win-unpacked/ERGG Overlay.exe" -ArgumentList "--smoke" -RedirectStandardOutput "smoke-out.log" -RedirectStandardError "smoke-error.log" -PassThru
          if (-not $proc.WaitForExit(45000)) { $proc.Kill(); throw "Packaged app smoke timed out" }
          Get-Content smoke-out.log, smoke-error.log
          if ($proc.ExitCode -ne 0) { throw "Packaged app smoke failed: $($proc.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ERGG-Overlay-Windows-x64
          path: |
            desktop/dist/ERGG-Overlay-*-Windows-x64.exe
            desktop/README.md
          retention-days: 30
